services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bsbr
      POSTGRES_PASSWORD: bsbr
      POSTGRES_DB: bsbr
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bsbr"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: &backend_env
      DATABASE_URL: postgresql+asyncpg://bsbr:bsbr@postgres:5432/bsbr
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      ENVIRONMENT: dev
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Assina os cookies de sessão (admin + usuários do site). Sem isso o
      # backend usa fallbacks conhecidos — defina um valor forte em prod.
      SESSION_SECRET: ${SESSION_SECRET:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      STEAM_RETURN_TO: ${STEAM_RETURN_TO:-http://localhost:8000/api/v1/auth/steam/callback}
    volumes:
      - ./backend:/app
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.core.tasks_app.celery_app worker --loglevel=info --concurrency=2
    environment: *backend_env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    command: celery -A app.core.tasks_app.celery_app beat --loglevel=info
    environment: *backend_env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  live:
    build: ./backend
    command: python -m app.services.live.runner
    environment: *backend_env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        # Embutido no bundle do NAVEGADOR (precisa ser alcançável pelo client)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-8000}/api/v1}
    environment:
      # Fetches server-side (RSC) dentro da rede do compose; o bundle do
      # navegador usa a NEXT_PUBLIC_API_URL embutida no build (args acima)
      API_INTERNAL_URL: http://api:8000/api/v1
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  pgdata:
