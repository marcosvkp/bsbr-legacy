[alembic]
script_location = ./alembic
path_separator = os
prepend_sys_path = .

# A URL real vem do ambiente (DATABASE_URL via app.core.config.get_settings);
# o env.py sobrescreve este valor. Vazio aqui para não vazar credenciais.
sqlalchemy.url =

# Nomes de arquivo com data para ordenação cronológica óbvia
file_template = %%(year)d_%%(month)02d_%%(day)02d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
