# BSBR — proxy reverso do domínio bsbr.pro com TLS (Let's Encrypt).
# Frontend (Next.js) em web:3000, API (FastAPI) em api:8000.
# Carregado como /etc/nginx/conf.d/bsbr.pro.conf dentro do container nginx.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# HTTP -> HTTPS (mantém o desafio ACME do certbot acessível)
server {
    listen 80;
    server_name bsbr.pro www.bsbr.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name bsbr.pro www.bsbr.pro;

    ssl_certificate     /etc/letsencrypt/live/bsbr.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bsbr.pro/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # API + WebSocket ao vivo (/api/v1/ws/live)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Frontend Next.js (SSR)
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
